<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f4">
  <title>Calorie Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #17221b; background: #f5f7f4; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; }
    main { width: min(100%, 520px); margin: 0 auto; }
    h1 { margin-bottom: 6px; font-size: 1.8rem; }
    .intro { margin-top: 0; color: #59665e; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 24px 0; }
    button { min-height: 48px; padding: 12px 16px; border: 0; border-radius: 10px; background: #176c45; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    button.secondary { background: #e2e9e3; color: #17221b; }
    button:disabled { opacity: .6; cursor: wait; }
    .panel, .result { padding: 18px; border: 1px solid #dce4dd; border-radius: 14px; background: white; }
    .panel { margin-bottom: 16px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid #aebbb1; border-radius: 8px; font: inherit; }
    form { display: grid; gap: 12px; }
    #reader { width: 100%; overflow: hidden; border-radius: 10px; }
    #reader video { border-radius: 10px; }
    .status { min-height: 24px; margin: 14px 2px; color: #46534a; }
    .status.error { color: #a22626; }
    .result h2 { margin: 0 0 4px; }
    .username-form { display: grid; gap: 10px; }
    .entry-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .diary-entry { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #e5ebe6; }
    .diary-entry p { margin: 3px 0 0; color: #59665e; font-size: .9rem; }
    .diary-entry details { margin-top: 8px; }
    .diary-entry summary { color: #176c45; cursor: pointer; }
    .diary-entry button { min-height: 38px; padding: 8px 12px; background: #e2e9e3; color: #17221b; }
    .total { font-weight: 700; }
    .muted { margin: 0 0 16px; color: #59665e; }
    dl { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; margin: 0; }
    dt { color: #59665e; font-size: .88rem; }
    dd { margin: 3px 0 0; font-weight: 600; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
    @media (max-width: 380px) { .actions { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Calorie Tracker</h1>
    <p class="intro">Look up foods by barcode and keep a simple diary in this browser.</p>

    <section class="panel" aria-labelledby="account-heading">
      <h2 id="account-heading">Your diary</h2>
      <form id="username-form" class="username-form">
        <div><label for="username">Username</label><input id="username" type="text" autocomplete="username" maxlength="24" placeholder="Choose a username" required></div>
        <button type="submit">Open or create diary</button>
      </form>
      <p id="account-status" class="status" role="status" aria-live="polite">Type a username to start. Your diary is saved only in this browser.</p>
      <div id="current-account" hidden>
        <p id="current-account-name" class="muted"></p>
        <button type="button" class="secondary" id="change-user">Switch username</button>
      </div>
    </section>

    <div class="actions">
      <button id="manual-button" type="button">Enter barcode</button>
      <button id="camera-button" class="secondary" type="button">Scan with camera</button>
    </div>

    <section id="manual-panel" class="panel" hidden>
      <form id="barcode-form">
        <div>
          <label for="barcode">Barcode number</label>
          <input id="barcode" name="barcode" inputmode="numeric" autocomplete="off" placeholder="e.g. 4000177026717" required pattern="[0-9]+">
        </div>
        <button type="submit">Find product</button>
      </form>
    </section>

    <section id="camera-panel" class="panel" hidden>
      <div id="reader"></div>
      <button id="stop-camera" class="secondary" type="button" style="width:100%; margin-top:12px">Stop camera</button>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="product" class="result" hidden aria-live="polite">
      <h2 id="product-name"></h2>
      <p id="product-brand" class="muted"></p>
      <dl>
        <div><dt>Barcode</dt><dd id="value-barcode"></dd></div>
        <div><dt>Package</dt><dd id="value-package"></dd></div>
        <div><dt>Serving</dt><dd id="value-serving"></dd></div>
        <div><dt>Calories per serving</dt><dd id="value-calories"></dd></div>
        <div><dt>Protein</dt><dd id="value-protein"></dd></div>
        <div><dt>Carbohydrates</dt><dd id="value-carbs"></dd></div>
        <div><dt>Sugar</dt><dd id="value-sugar"></dd></div>
        <div><dt>Fat</dt><dd id="value-fat"></dd></div>
        <div><dt>Saturated fat</dt><dd id="value-saturated-fat"></dd></div>
        <div><dt>Fiber</dt><dd id="value-fiber"></dd></div>
        <div><dt>Salt</dt><dd id="value-salt"></dd></div>
      </dl>
      <div class="entry-actions">
        <div><label for="servings">Servings</label><input id="servings" type="number" min="0.25" step="0.25" value="1"></div>
        <button id="log-entry" type="button" disabled>Add to diary</button>
      </div>
    </section>

    <section id="diary-panel" class="panel" hidden>
      <h2>Food diary</h2>
      <label for="diary-date">Date</label>
      <input id="diary-date" type="date">
      <p id="diary-total" class="total">0 kcal</p>
      <div id="diary-entries"></div>
    </section>
  </main>

  <script>
    const manualPanel = document.getElementById("manual-panel");
    const cameraPanel = document.getElementById("camera-panel");
    const manualButton = document.getElementById("manual-button");
    const cameraButton = document.getElementById("camera-button");
    const status = document.getElementById("status");
    const productPanel = document.getElementById("product");
    const accountStatus = document.getElementById("account-status");
    const STORAGE_PREFIX = "calorie-tracker:diary:";
    let scanner = null;
    let currentUsername = null;
    let diaryEntries = [];
    let currentProduct = null;

    function showStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    function showAccountStatus(message, isError = false) {
      accountStatus.textContent = message;
      accountStatus.classList.toggle("error", isError);
    }

    function displayProduct(product) {
      const value = (item, unit = "") => item === null || item === undefined || item === "" ? "Not available" : `${item}${unit}`;
      const set = (id, text) => { document.getElementById(id).textContent = text; };
      set("product-name", product.name || "Unknown product");
      set("product-brand", product.brand || "");
      set("value-barcode", value(product.barcode));
      set("value-package", value(product.package_quantity, product.package_unit ? ` ${product.package_unit}` : ""));
      set("value-serving", value(product.serving_quantity, product.serving_unit ? ` ${product.serving_unit}` : ""));
      set("value-calories", value(product.calories, " kcal"));
      set("value-protein", value(product.protein, " g"));
      set("value-carbs", value(product.carbs, " g"));
      set("value-sugar", value(product.sugar, " g"));
      set("value-fat", value(product.fat, " g"));
      set("value-saturated-fat", value(product.saturated_fat, " g"));
      set("value-fiber", value(product.fiber, " g"));
      set("value-salt", value(product.salt, " g"));
      productPanel.hidden = false;
      currentProduct = product;
      document.getElementById("log-entry").disabled = !currentUsername;
    }

    async function lookupBarcode(rawBarcode) {
      const barcode = rawBarcode.trim();
      if (!/^\d+$/.test(barcode)) {
        showStatus("Enter a numeric barcode.", true);
        return;
      }
      productPanel.hidden = true;
      showStatus("Looking up product…");
      try {
        const response = await fetch(`/api?barcode=${encodeURIComponent(barcode)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Product lookup failed.");
        displayProduct(data);
        showStatus("");
      } catch (error) {
        showStatus(error.message || "Could not contact the product lookup service.", true);
      }
    }

    async function stopCamera() {
      if (!scanner) return;
      try {
        if (scanner.isScanning) await scanner.stop();
        scanner.clear();
      } catch (_) {
        // The camera may already have stopped after the browser revoked access.
      }
      scanner = null;
      cameraPanel.hidden = true;
    }

    manualButton.addEventListener("click", () => {
      cameraPanel.hidden = true;
      manualPanel.hidden = false;
      document.getElementById("barcode").focus();
      showStatus("");
    });

    document.getElementById("barcode-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      await lookupBarcode(document.getElementById("barcode").value);
    });

    cameraButton.addEventListener("click", async () => {
      await stopCamera();
      manualPanel.hidden = true;
      cameraPanel.hidden = false;
      showStatus("Allow camera access. Keep the whole barcode in view and hold the camera steady until it focuses.");
      if (typeof Html5Qrcode === "undefined") {
        showStatus("The camera scanner could not load. You can enter the barcode manually.", true);
        cameraPanel.hidden = true;
        manualPanel.hidden = false;
        return;
      }
      scanner = new Html5Qrcode("reader", {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128
        ],
        // Use a browser's native decoder where available; the library falls
        // back to ZXing on browsers without BarcodeDetector support.
        useBarCodeDetectorIfSupported: true,
        verbose: false
      });
      try {
        await scanner.start(
          // `exact` requires the rear-facing camera; it cannot silently fall
          // back to the front camera when the browser honors this constraint.
          { facingMode: { exact: "environment" } },
          {
            fps: 12,
            // Scan the full camera image instead of cropping to a small box.
            // Html5Qrcode's videoConstraints override cameraIdOrConfig, so the
            // rear-camera requirement must be repeated here as well.
            videoConstraints: {
              facingMode: { exact: "environment" },
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            }
          },
          async (decodedText) => {
            await stopCamera();
            await lookupBarcode(decodedText);
          },
          () => {}
        );
      } catch (_) {
        await stopCamera();
        manualPanel.hidden = false;
        showStatus("Could not start the rear camera. Check camera permission or enter the barcode manually.", true);
      }
    });

    document.getElementById("stop-camera").addEventListener("click", async () => {
      await stopCamera();
      showStatus("Camera stopped.");
    });

    function localDateString(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function storageKey(username = currentUsername) {
      return `${STORAGE_PREFIX}${username.toLowerCase()}`;
    }

    function saveDiary(entries) {
      localStorage.setItem(storageKey(), JSON.stringify(entries));
    }

    function formatQuantity(value, unit, servings = 1) {
      if (value === null || value === undefined || value === "") return "Not available";
      const number = Number(value);
      if (!Number.isFinite(number)) return String(value);
      const total = Number((number * servings).toFixed(2));
      return `${total} ${unit}`;
    }

    function renderDiary() {
      if (!currentUsername) return;
      const entriesElement = document.getElementById("diary-entries");
      const selectedDate = document.getElementById("diary-date").value;
      const entries = diaryEntries
        .filter((entry) => localDateString(new Date(entry.eaten_at)) === selectedDate)
        .sort((a, b) => new Date(b.eaten_at) - new Date(a.eaten_at));
      entriesElement.replaceChildren();
      const totalCalories = entries.reduce((sum, entry) => sum + (Number(entry.product.calories) || 0) * Number(entry.servings), 0);
      document.getElementById("diary-total").textContent = `${Math.round(totalCalories)} kcal on ${selectedDate}`;

      const nutrients = [
        ["calories", "Calories", "kcal"],
        ["protein", "Protein", "g"],
        ["carbs", "Carbohydrates", "g"],
        ["sugar", "Sugar", "g"],
        ["fat", "Fat", "g"],
        ["saturated_fat", "Saturated fat", "g"],
        ["fiber", "Fiber", "g"],
        ["salt", "Salt", "g"]
      ];

      for (const entry of entries) {
        const row = document.createElement("div");
        row.className = "diary-entry";
        const details = document.createElement("div");
        const name = document.createElement("strong");
        name.textContent = entry.product.name || "Unknown product";
        const meta = document.createElement("p");
        const product = entry.product;
        const kcal = formatQuantity(product.calories, "kcal", entry.servings);
        meta.textContent = `${entry.servings} serving(s) · ${kcal}${product.brand ? ` · ${product.brand}` : ""}`;
        details.append(name, meta);

        const facts = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = "Nutrition details";
        const list = document.createElement("dl");
        for (const [key, label, unit] of nutrients) {
          const term = document.createElement("dt");
          term.textContent = label;
          const value = document.createElement("dd");
          value.textContent = formatQuantity(product[key], unit, entry.servings);
          list.append(term, value);
        }
        const productInfo = document.createElement("p");
        productInfo.className = "muted";
        productInfo.textContent = `Barcode: ${product.barcode || "Not available"} · Package: ${product.package_quantity ?? "Not available"} ${product.package_unit || ""} · Serving: ${product.serving_quantity ?? "Not available"} ${product.serving_unit || ""}`;
        facts.append(summary, productInfo, list);
        details.append(facts);

        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "Remove";
        remove.addEventListener("click", async () => {
          diaryEntries = diaryEntries.filter((saved) => saved.id !== entry.id);
          try {
            saveDiary(diaryEntries);
            renderDiary();
          } catch (_) {
            showStatus("Could not save this change in browser storage.", true);
          }
        });
        row.append(details, remove);
        entriesElement.append(row);
      }
      if (entries.length === 0) entriesElement.textContent = "No foods logged for this date.";
    }

    document.getElementById("username-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const username = document.getElementById("username").value.trim();
      if (!/^[A-Za-z0-9_]{1,24}$/.test(username)) {
        showAccountStatus("Use 1–24 letters, numbers, or underscores.", true);
        return;
      }

      currentUsername = username.toLowerCase();
      try {
        const stored = localStorage.getItem(storageKey());
        diaryEntries = stored ? JSON.parse(stored) : [];
        if (!Array.isArray(diaryEntries)) throw new Error("Saved diary data has an invalid format.");
        document.getElementById("username-form").hidden = true;
        document.getElementById("current-account").hidden = false;
        document.getElementById("current-account-name").textContent = `Diary for ${username}`;
        document.getElementById("diary-panel").hidden = false;
        document.getElementById("diary-date").value = localDateString(new Date());
        document.getElementById("log-entry").disabled = !currentProduct;
        showAccountStatus("Diary ready. It is saved only in this browser.");
        renderDiary();
      } catch (error) {
        currentUsername = null;
        diaryEntries = [];
        showAccountStatus(error.message || "Could not open this browser's saved diary.", true);
      }
    });

    document.getElementById("change-user").addEventListener("click", () => {
      currentUsername = null;
      diaryEntries = [];
      document.getElementById("username-form").hidden = false;
      document.getElementById("current-account").hidden = true;
      document.getElementById("diary-panel").hidden = true;
      document.getElementById("log-entry").disabled = true;
      showAccountStatus("Enter a username to open a diary in this browser.");
    });

    document.getElementById("diary-date").addEventListener("change", renderDiary);

    document.getElementById("log-entry").addEventListener("click", () => {
      if (!currentUsername || !currentProduct) return;
      const servings = Number(document.getElementById("servings").value);
      if (!Number.isFinite(servings) || servings <= 0) {
        showStatus("Enter a serving amount greater than zero.", true);
        return;
      }

      const entry = {
        id: globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`,
        eaten_at: new Date().toISOString(),
        servings,
        product: { ...currentProduct }
      };
      const updatedEntries = [...diaryEntries, entry];
      try {
        saveDiary(updatedEntries);
        diaryEntries = updatedEntries;
        document.getElementById("diary-date").value = localDateString(new Date(entry.eaten_at));
        showStatus("Added food to your diary.");
        renderDiary();
      } catch (_) {
        showStatus("Could not save the diary in this browser. Check available browser storage.", true);
      }
    });
  </script>
</body>
</html>
