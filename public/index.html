<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f4">
  <title>Calorie Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #17221b; background: #f5f7f4; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; }
    main { width: min(100%, 520px); margin: 0 auto; }
    h1 { margin-bottom: 6px; font-size: 1.8rem; }
    .intro { margin-top: 0; color: #59665e; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 24px 0; }
    button { min-height: 48px; padding: 12px 16px; border: 0; border-radius: 10px; background: #176c45; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    button.secondary { background: #e2e9e3; color: #17221b; }
    button:disabled { opacity: .6; cursor: wait; }
    .panel, .result { padding: 18px; border: 1px solid #dce4dd; border-radius: 14px; background: white; }
    .panel { margin-bottom: 16px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid #aebbb1; border-radius: 8px; font: inherit; }
    form { display: grid; gap: 12px; }
    #reader { width: 100%; overflow: hidden; border-radius: 10px; }
    #reader video { border-radius: 10px; }
    .status { min-height: 24px; margin: 14px 2px; color: #46534a; }
    .status.error { color: #a22626; }
    .result h2 { margin: 0 0 4px; }
    .auth-form { display: grid; gap: 10px; }
    .auth-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .entry-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .diary-entry { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #e5ebe6; }
    .diary-entry p { margin: 3px 0 0; color: #59665e; font-size: .9rem; }
    .diary-entry button { min-height: 38px; padding: 8px 12px; background: #e2e9e3; color: #17221b; }
    .total { font-weight: 700; }
    .muted { margin: 0 0 16px; color: #59665e; }
    dl { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; margin: 0; }
    dt { color: #59665e; font-size: .88rem; }
    dd { margin: 3px 0 0; font-weight: 600; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
    @media (max-width: 380px) { .actions { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Calorie Tracker</h1>
    <p class="intro">Look up nutrition information by barcode.</p>

    <section class="panel" aria-labelledby="account-heading">
      <h2 id="account-heading">Account</h2>
      <form id="auth-form" class="auth-form">
        <div><label for="username">Username</label><input id="username" type="text" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" title="Use 3–24 letters, numbers, or underscores." required></div>
        <div><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div>
        <div class="auth-actions">
          <button type="submit" data-auth-action="signin">Sign in</button>
          <button type="button" class="secondary" id="signup-button">Create account</button>
        </div>
      </form>
      <p id="auth-status" class="status" role="status" aria-live="polite">Connecting to Supabase…</p>
      <div id="signed-in" hidden>
        <p id="account-name" class="muted"></p>
        <button type="button" class="secondary" id="signout-button">Sign out</button>
      </div>
    </section>

    <div class="actions">
      <button id="manual-button" type="button">Enter barcode</button>
      <button id="camera-button" class="secondary" type="button">Scan with camera</button>
    </div>

    <section id="manual-panel" class="panel" hidden>
      <form id="barcode-form">
        <div>
          <label for="barcode">Barcode number</label>
          <input id="barcode" name="barcode" inputmode="numeric" autocomplete="off" placeholder="e.g. 4000177026717" required pattern="[0-9]+">
        </div>
        <button type="submit">Find product</button>
      </form>
    </section>

    <section id="camera-panel" class="panel" hidden>
      <div id="reader"></div>
      <button id="stop-camera" class="secondary" type="button" style="width:100%; margin-top:12px">Stop camera</button>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="product" class="result" hidden aria-live="polite">
      <h2 id="product-name"></h2>
      <p id="product-brand" class="muted"></p>
      <dl>
        <div><dt>Barcode</dt><dd id="value-barcode"></dd></div>
        <div><dt>Package</dt><dd id="value-package"></dd></div>
        <div><dt>Serving</dt><dd id="value-serving"></dd></div>
        <div><dt>Calories per serving</dt><dd id="value-calories"></dd></div>
        <div><dt>Protein</dt><dd id="value-protein"></dd></div>
        <div><dt>Carbohydrates</dt><dd id="value-carbs"></dd></div>
        <div><dt>Sugar</dt><dd id="value-sugar"></dd></div>
        <div><dt>Fat</dt><dd id="value-fat"></dd></div>
        <div><dt>Saturated fat</dt><dd id="value-saturated-fat"></dd></div>
        <div><dt>Fiber</dt><dd id="value-fiber"></dd></div>
        <div><dt>Salt</dt><dd id="value-salt"></dd></div>
      </dl>
      <div class="entry-actions">
        <div><label for="servings">Servings</label><input id="servings" type="number" min="0.25" step="0.25" value="1"></div>
        <button id="log-entry" type="button" disabled>Add to diary</button>
      </div>
    </section>

    <section id="diary-panel" class="panel" hidden>
      <h2>Today’s diary</h2>
      <p id="diary-total" class="total">0 kcal</p>
      <div id="diary-entries"></div>
    </section>
  </main>

  <script>
    const manualPanel = document.getElementById("manual-panel");
    const cameraPanel = document.getElementById("camera-panel");
    const manualButton = document.getElementById("manual-button");
    const cameraButton = document.getElementById("camera-button");
    const status = document.getElementById("status");
    const productPanel = document.getElementById("product");
    let scanner = null;
    let supabase = null;
    let currentUser = null;
    let currentProduct = null;

    function showStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    function showAuthStatus(message, isError = false) {
      const authStatus = document.getElementById("auth-status");
      authStatus.textContent = message;
      authStatus.classList.toggle("error", isError);
    }

    function displayProduct(product) {
      const value = (item, unit = "") => item === null || item === undefined || item === "" ? "Not available" : `${item}${unit}`;
      const set = (id, text) => { document.getElementById(id).textContent = text; };
      set("product-name", product.name || "Unknown product");
      set("product-brand", product.brand || "");
      set("value-barcode", value(product.barcode));
      set("value-package", value(product.package_quantity, product.package_unit ? ` ${product.package_unit}` : ""));
      set("value-serving", value(product.serving_quantity, product.serving_unit ? ` ${product.serving_unit}` : ""));
      set("value-calories", value(product.calories, " kcal"));
      set("value-protein", value(product.protein, " g"));
      set("value-carbs", value(product.carbs, " g"));
      set("value-sugar", value(product.sugar, " g"));
      set("value-fat", value(product.fat, " g"));
      set("value-saturated-fat", value(product.saturated_fat, " g"));
      set("value-fiber", value(product.fiber, " g"));
      set("value-salt", value(product.salt, " g"));
      productPanel.hidden = false;
      currentProduct = product;
      document.getElementById("log-entry").disabled = !currentUser;
    }

    async function lookupBarcode(rawBarcode) {
      const barcode = rawBarcode.trim();
      if (!/^\d+$/.test(barcode)) {
        showStatus("Enter a numeric barcode.", true);
        return;
      }
      productPanel.hidden = true;
      showStatus("Looking up product…");
      try {
        const response = await fetch(`/api?barcode=${encodeURIComponent(barcode)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Product lookup failed.");
        displayProduct(data);
        showStatus("");
      } catch (error) {
        showStatus(error.message || "Could not contact the product lookup service.", true);
      }
    }

    async function stopCamera() {
      if (!scanner) return;
      try {
        if (scanner.isScanning) await scanner.stop();
        scanner.clear();
      } catch (_) {
        // The camera may already have stopped after the browser revoked access.
      }
      scanner = null;
      cameraPanel.hidden = true;
    }

    manualButton.addEventListener("click", () => {
      cameraPanel.hidden = true;
      manualPanel.hidden = false;
      document.getElementById("barcode").focus();
      showStatus("");
    });

    document.getElementById("barcode-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      await lookupBarcode(document.getElementById("barcode").value);
    });

    cameraButton.addEventListener("click", async () => {
      await stopCamera();
      manualPanel.hidden = true;
      cameraPanel.hidden = false;
      showStatus("Allow camera access. Keep the whole barcode in view and hold the camera steady until it focuses.");
      if (typeof Html5Qrcode === "undefined") {
        showStatus("The camera scanner could not load. You can enter the barcode manually.", true);
        cameraPanel.hidden = true;
        manualPanel.hidden = false;
        return;
      }
      scanner = new Html5Qrcode("reader", {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128
        ],
        // Use a browser's native decoder where available; the library falls
        // back to ZXing on browsers without BarcodeDetector support.
        useBarCodeDetectorIfSupported: true,
        verbose: false
      });
      try {
        await scanner.start(
          // `exact` requires the rear-facing camera; it cannot silently fall
          // back to the front camera when the browser honors this constraint.
          { facingMode: { exact: "environment" } },
          {
            fps: 12,
            // Scan the full camera image instead of cropping to a small box.
            // Html5Qrcode's videoConstraints override cameraIdOrConfig, so the
            // rear-camera requirement must be repeated here as well.
            videoConstraints: {
              facingMode: { exact: "environment" },
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            }
          },
          async (decodedText) => {
            await stopCamera();
            await lookupBarcode(decodedText);
          },
          () => {}
        );
      } catch (_) {
        await stopCamera();
        manualPanel.hidden = false;
        showStatus("Could not start the rear camera. Check camera permission or enter the barcode manually.", true);
      }
    });

    document.getElementById("stop-camera").addEventListener("click", async () => {
      await stopCamera();
      showStatus("Camera stopped.");
    });

    function setAccount(user) {
      currentUser = user;
      document.getElementById("auth-form").hidden = Boolean(user);
      document.getElementById("signed-in").hidden = !user;
      document.getElementById("account-name").textContent = user ? `Signed in as ${user.user_metadata?.username || "your account"}` : "";
      document.getElementById("log-entry").disabled = !user || !currentProduct;
      document.getElementById("diary-panel").hidden = !user;
      if (user) loadDiary();
      else document.getElementById("diary-entries").replaceChildren();
    }

    async function loadDiary() {
      if (!supabase || !currentUser) return;
      const entriesElement = document.getElementById("diary-entries");
      entriesElement.textContent = "Loading diary…";
      const start = new Date();
      start.setHours(0, 0, 0, 0);
      const end = new Date(start);
      end.setDate(end.getDate() + 1);
      const { data, error } = await supabase.from("food_entries")
        .select("id, product_name, brand, servings, calories_per_serving_kcal, eaten_at")
        .gte("eaten_at", start.toISOString()).lt("eaten_at", end.toISOString())
        .order("eaten_at", { ascending: false });
      if (error) {
        entriesElement.textContent = `Could not load diary: ${error.message}`;
        return;
      }
      entriesElement.replaceChildren();
      const total = (data || []).reduce((sum, item) => sum + (Number(item.calories_per_serving_kcal) || 0) * Number(item.servings), 0);
      document.getElementById("diary-total").textContent = `${Math.round(total)} kcal today`;
      for (const item of data || []) {
        const row = document.createElement("div");
        row.className = "diary-entry";
        const details = document.createElement("div");
        const name = document.createElement("strong");
        name.textContent = item.product_name;
        const meta = document.createElement("p");
        const kcal = item.calories_per_serving_kcal == null ? "calories unavailable" : `${Math.round(Number(item.calories_per_serving_kcal) * Number(item.servings))} kcal`;
        meta.textContent = `${item.servings} serving(s) · ${kcal}${item.brand ? ` · ${item.brand}` : ""}`;
        details.append(name, meta);
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "Remove";
        remove.addEventListener("click", async () => {
          const { error: deleteError } = await supabase.from("food_entries").delete().eq("id", item.id);
          if (deleteError) showStatus(`Could not remove entry: ${deleteError.message}`, true);
          else loadDiary();
        });
        row.append(details, remove);
        entriesElement.append(row);
      }
      if (!data || data.length === 0) entriesElement.textContent = "No foods logged today yet.";
    }

    async function initializeSupabase() {
      showAuthStatus("Connecting to Supabase…");
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);
      try {
        const response = await fetch("/api/config", { signal: controller.signal });
        const config = await response.json();
        if (!response.ok) throw new Error(config.error || "Supabase is not configured.");
        if (!window.supabase?.createClient) throw new Error("Supabase client could not load.");
        supabase = window.supabase.createClient(config.url, config.publishableKey);
        showAuthStatus("Loading your saved session…");
        const { data: { session } } = await supabase.auth.getSession();
        setAccount(session?.user || null);
        showAuthStatus(session?.user ? "Signed in." : "Ready. Sign in or create an account.");
        supabase.auth.onAuthStateChange((_event, nextSession) => {
          queueMicrotask(() => setAccount(nextSession?.user || null));
        });
      } catch (error) {
        const message = error.name === "AbortError"
          ? "The /api/config request timed out. Check that the latest Vercel deployment includes api/config.py."
          : (error.message || "Could not connect to Supabase. Check the Vercel environment variables and redeploy.");
        showAuthStatus(message, true);
      } finally {
        clearTimeout(timeout);
      }
    }

    function usernameCredentials() {
      const raw = document.getElementById("username").value.trim();
      if (!/^[A-Za-z0-9_]{3,24}$/.test(raw)) {
        throw new Error("Use a username with 3–24 letters, numbers, or underscores.");
      }
      const username = raw.toLowerCase();
      // Supabase Auth currently signs in with email or phone. This reserved,
      // non-deliverable address gives each username a stable internal identity.
      return { username, email: `${username}@login.calorietracker.invalid` };
    }

    document.getElementById("auth-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!supabase) return showAuthStatus("Supabase is not configured yet. Check Vercel environment variables and redeploy.", true);
      const password = document.getElementById("password").value;
      let credentials;
      try { credentials = usernameCredentials(); }
      catch (error) { return showAuthStatus(error.message, true); }
      showAuthStatus("Signing in…");
      try {
        const { error } = await supabase.auth.signInWithPassword({ email: credentials.email, password });
        showAuthStatus(error ? error.message : "Signed in.", Boolean(error));
      } catch (error) {
        showAuthStatus(error.message || "Sign-in failed. Check your connection and try again.", true);
      }
    });

    document.getElementById("signup-button").addEventListener("click", async () => {
      if (!supabase) return showAuthStatus("Supabase is not configured yet. Check Vercel environment variables and redeploy.", true);
      const password = document.getElementById("password").value;
      if (password.length < 6) return showAuthStatus("Enter a password with at least 6 characters.", true);
      let credentials;
      try { credentials = usernameCredentials(); }
      catch (error) { return showAuthStatus(error.message, true); }
      showAuthStatus("Creating account…");
      try {
        const { data, error } = await supabase.auth.signUp({
          email: credentials.email,
          password,
          options: { data: { username: credentials.username } }
        });
        if (error) showAuthStatus(error.message, true);
        else if (data.session) showAuthStatus("Account created and signed in.");
        else showAuthStatus("Account created, but sign-in needs Confirm email turned off in Supabase: Authentication → Providers → Email.", true);
      } catch (error) {
        showAuthStatus(error.message || "Account creation failed. Check your connection and try again.", true);
      }
    });

    document.getElementById("signout-button").addEventListener("click", async () => {
      const { error } = await supabase.auth.signOut();
      showStatus(error ? error.message : "Signed out.", Boolean(error));
    });

    document.getElementById("log-entry").addEventListener("click", async () => {
      if (!supabase || !currentUser || !currentProduct) return;
      const servings = Number(document.getElementById("servings").value);
      if (!Number.isFinite(servings) || servings <= 0) return showStatus("Enter a serving amount greater than zero.", true);
      const product = currentProduct;
      const { error } = await supabase.from("food_entries").insert({
        user_id: currentUser.id,
        product_name: product.name || "Unknown product",
        brand: product.brand || null,
        barcode: product.barcode || null,
        servings,
        calories_per_serving_kcal: product.calories,
        protein_per_serving_g: product.protein,
        carbs_per_serving_g: product.carbs,
        fat_per_serving_g: product.fat
      });
      if (error) showStatus(`Could not add food: ${error.message}`, true);
      else {
        showStatus("Added to your diary.");
        loadDiary();
      }
    });

    initializeSupabase();
  </script>
</body>
</html>
